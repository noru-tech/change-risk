# Publish the change-risk crate to crates.io. Called by release.yml as a cargo-dist custom publish
# job (publish-jobs = ["./publish-crates"] in dist-workspace.toml) once the GitHub Release exists.
# Authenticates with crates.io trusted publishing: a short-lived token minted from the job's OIDC
# token, no API token secret. crates.io matches the calling workflow, so the trusted publisher on
# crates.io names release.yml, not this file.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        description: The dist-manifest.json from `dist host`.
        required: true
        type: string

permissions: {}

jobs:
  crates-io:
    name: cargo publish
    runs-on: ubuntu-latest
    # Prereleases stay off crates.io.
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    permissions:
      contents: read
      # Exchanged for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

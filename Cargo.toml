[package]
name = "change-risk"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic change risk tiers from changed paths, a sensitivity map and declared facts, as an in-toto predicate."
license = "MIT"
repository = "https://github.com/noru-tech/change-risk"
homepage = "https://github.com/noru-tech/change-risk"
documentation = "https://github.com/noru-tech/change-risk#readme"
readme = "README.md"
keywords = ["change-management", "compliance", "risk", "in-toto", "sdlc"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Noru <bip@noru.tech>"]
include = [
  "src/**",
  "schemas/**",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
]

[lib]
name = "change_risk"
path = "src/lib.rs"

[[bin]]
name = "crisk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
globset = "0.4"
jsonschema = { version = "0.58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
serde-saphyr = "2.0"
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
